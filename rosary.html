<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1e2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مسبحة">
<title>مسبحة إلكترونية</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  overscroll-behavior-x: none;
  overscroll-behavior-y: none;
}

body {
  background: linear-gradient(145deg, #0b0e14 0%, #1a1e2b 100%);
  font-family: 'Segoe UI', 'Tahoma', sans-serif;
  display: flex;
  flex-direction: column;
  touch-action: pan-y;
}

/* شريط علوي ثابت */
.top-bar {
  display: flex;
  gap: 8px;
  padding: 8px 10px;
  background: linear-gradient(180deg, #1e2230, #151924);
  border-bottom: 1px solid rgba(255, 215, 0, 0.15);
  z-index: 20;
  flex-shrink: 0;
  align-items: center;
}

.btn {
  background: linear-gradient(145deg, #2e3444, #1c212e);
  border: 1px solid rgba(255, 215, 0, 0.25);
  color: #e8e0c0;
  padding: 10px 16px;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 3px 0 #0b0e14, 0 4px 10px rgba(0, 0, 0, 0.5);
  transition: all 0.1s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
  white-space: nowrap;
  letter-spacing: 0.3px;
  touch-action: manipulation;
}

.btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #0b0e14, 0 2px 6px rgba(0, 0, 0, 0.5);
}

/* زر التثبيت بالزاوية اليسرى */
.btn.install {
  border-color: rgba(80, 200, 120, 0.5);
  color: #b0ffc0;
  padding: 10px 14px;
  flex-shrink: 0;
  order: -1;
  margin-left: auto;
}

.btn.install.hidden {
  display: none;
}

.btn.select-btn {
  flex: 1;
  justify-content: center;
  border-color: rgba(255, 215, 0, 0.4);
  color: #ffd966;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.btn.select-btn span.label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.9rem;
}

/* المنطقة الرئيسية القابلة للضغط */
.tap-area {
  flex: 1;
  width: 100%;
  background: radial-gradient(circle at 30% 20%, #2a2f3f, #0f1219);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  touch-action: manipulation;
  transition: background 0.1s;
  padding: 15px;
}

.tap-area:active,
.tap-area.pressed {
  background: radial-gradient(circle at 30% 20%, #333a4a, #141824);
}

.tap-area::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
}

.tap-area.pressed::after {
  opacity: 1;
}

/* اسم الذكر الحالي - عرض كامل */
.current-dhikr {
  color: #c8b880;
  font-size: clamp(0.9rem, 3.5vw, 1.1rem);
  text-align: center;
  padding: 0 10px;
  margin-bottom: 15px;
  line-height: 1.65;
  max-height: 45vh;
  overflow-y: auto;
  opacity: 0.9;
  font-weight: 500;
  width: 100%;
  word-wrap: break-word;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}


/* دائرة التسبيح الرئيسية */
.tap-circle {
  width: min(78vw, 360px);
  height: min(78vw, 360px);
  min-width: 245px;
  min-height: 245px;
  max-width: 360px;
  max-height: 360px;
  border-radius: 50%;
  border: 5px solid rgba(255, 217, 102, 0.85);
  outline: 2px solid rgba(255, 217, 102, 0.22);
  outline-offset: 8px;
  background:
    radial-gradient(circle at 35% 28%, rgba(255,255,255,.16), transparent 34%),
    radial-gradient(circle at 50% 42%, #39445a 0%, #222b3d 52%, #111824 100%);
  box-shadow:
    0 0 0 12px rgba(255, 217, 102, 0.06),
    0 16px 38px rgba(0,0,0,.55),
    inset 0 5px 18px rgba(255,255,255,.10),
    inset 0 -12px 22px rgba(0,0,0,.38);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  cursor: pointer;
  touch-action: manipulation;
  color: inherit;
  font-family: inherit;
  transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  position: relative;
  z-index: 1;
}
.tap-circle:active,
.tap-circle.pressed {
  transform: scale(.965);
  border-color: #fff0ad;
  box-shadow: 0 0 28px rgba(255,217,102,.28), inset 0 5px 22px rgba(0,0,0,.35);
}
.tap-circle .counter-display {
  font-size: clamp(4.5rem, 23vw, 8rem);
  line-height: 1;
}
.tap-circle .counter-label {
  margin-top: 0;
  color: #ffe8a1;
  opacity: .95;
  letter-spacing: .5px;
  font-size: 1rem;
  font-weight: 700;
}
.tap-area {
  gap: 18px;
}

/* عرض العداد */
.counter-display {
  font-size: clamp(5rem, 28vw, 12rem);
  font-weight: 800;
  color: #ffd966;
  text-shadow:
    0 0 20px rgba(255, 215, 0, 0.5),
    0 0 40px rgba(255, 215, 0, 0.2),
    0 8px 0 #3a2e0a;
  letter-spacing: 4px;
  line-height: 1;
  transition: transform 0.08s ease;
  font-family: 'Segoe UI', 'Tahoma', monospace;
  direction: ltr;
  flex-shrink: 0;
}

.counter-display.bump {
  transform: scale(1.08);
}

.counter-label {
  color: #a8b0c0;
  font-size: 0.95rem;
  letter-spacing: 2px;
  margin-top: 10px;
  opacity: 0.6;
  font-weight: 400;
}

/* الشريط السفلي */
.bottom-bar {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: linear-gradient(0deg, #1e2230, #151924);
  border-top: 1px solid rgba(255, 215, 0, 0.15);
  flex-shrink: 0;
  z-index: 20;
}

.btn.reset {
  flex: 1;
  justify-content: center;
  border-color: rgba(220, 80, 80, 0.5);
  color: #ffb0b0;
  padding: 12px 16px;
  font-size: 1rem;
}

/* نافذة اختيار الذكر (Modal) */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s ease;
  overscroll-behavior: contain;
}

.modal-overlay.show {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-content {
  background: linear-gradient(180deg, #232838, #1a1e2b);
  width: 100%;
  max-height: 85vh;
  border-radius: 24px 24px 0 0;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.25s ease;
  border-top: 1px solid rgba(255, 215, 0, 0.25);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255, 215, 0, 0.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.modal-header h2 {
  color: #ffd966;
  font-size: 1.15rem;
  font-weight: 700;
}

.modal-close {
  background: rgba(255, 255, 255, 0.08);
  border: none;
  color: #c8c8c8;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}

.modal-close:active {
  background: rgba(255, 255, 255, 0.15);
}

.modal-list {
  overflow-y: auto;
  padding: 8px 0 20px;
  flex: 1;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

.dhikr-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 20px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  transition: background 0.1s;
}

.dhikr-item:active {
  background: rgba(255, 215, 0, 0.08);
}

.dhikr-item.selected {
  background: rgba(255, 215, 0, 0.12);
  border-right: 3px solid #ffd966;
}

.dhikr-item .text {
  flex: 1;
  color: #e0e0e0;
  font-size: 0.92rem;
  line-height: 1.6;
  word-wrap: break-word;
}

.dhikr-item.selected .text {
  color: #fff8e0;
}

.dhikr-item .item-count {
  flex-shrink: 0;
  color: #a8b0c0;
  font-size: 0.8rem;
  background: rgba(255, 255, 255, 0.06);
  padding: 4px 10px;
  border-radius: 12px;
  min-width: 32px;
  text-align: center;
  direction: ltr;
  margin-top: 2px;
}

.dhikr-item.selected .item-count {
  background: rgba(255, 215, 0, 0.2);
  color: #ffd966;
}

/* نافذة التأكيد */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

.confirm-overlay.show {
  display: flex;
}

.confirm-box {
  background: linear-gradient(180deg, #2a2f3f, #1e2230);
  border-radius: 20px;
  padding: 24px;
  max-width: 360px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
  border: 1px solid rgba(255, 215, 0, 0.2);
  text-align: center;
  animation: scaleIn 0.2s ease;
}

@keyframes scaleIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.confirm-box .icon {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

.confirm-box h3 {
  color: #ffd966;
  font-size: 1.1rem;
  margin-bottom: 8px;
  font-weight: 700;
}

.confirm-box p {
  color: #c0c0c0;
  font-size: 0.9rem;
  margin-bottom: 20px;
  line-height: 1.5;
}

.confirm-actions {
  display: flex;
  gap: 10px;
}

.confirm-actions .btn {
  flex: 1;
  justify-content: center;
  padding: 12px;
}

.btn.cancel {
  border-color: rgba(150, 150, 150, 0.4);
  color: #c0c0c0;
}

.btn.danger {
  border-color: rgba(220, 80, 80, 0.6);
  color: #ffb0b0;
  background: linear-gradient(145deg, #3a2028, #2a1519);
}

/* إشعار */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e2230;
  color: #ffd966;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 0.95rem;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
  border: 1px solid rgba(255, 215, 0, 0.3);
  transition: transform 0.3s ease, opacity 0.3s;
  opacity: 0;
  pointer-events: none;
  z-index: 1000;
  text-align: center;
  max-width: 90vw;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* iOS safe area */
@supports (padding: env(safe-area-inset-top)) {
  .top-bar {
    padding-top: calc(8px + env(safe-area-inset-top));
  }
  .bottom-bar {
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
}

.creator-credit {
  flex-shrink: 0;
  text-align: center;
  padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
  background: #111621;
  color: #bfc7d5;
  font-size: .82rem;
  line-height: 1.6;
  border-top: 1px solid rgba(255,215,0,.10);
  z-index: 20;
}
.creator-credit strong { color: #ffd966; }
.creator-credit a {
  color: #8de0a3;
  text-decoration: none;
  font-weight: 700;
}

</style>
</head>
<body>

<!-- الشريط العلوي -->
<div class="top-bar">
  <button class="btn install hidden" id="installBtn" aria-label="تثبيت التطبيق">⬇️ تثبيت</button>
  <button class="btn select-btn" id="selectBtn" aria-label="اختر الذكر">
    <span>📖</span>
    <span class="label" id="selectLabel">اختر الذكر</span>
  </button>
</div>

<!-- المنطقة الرئيسية -->
<div class="tap-area" id="tapArea">
  <div class="current-dhikr" id="currentDhikr">ذكر مطلق</div>
  <button class="tap-circle" id="tapCircle" type="button" aria-label="اضغط للتسبيح وزيادة العداد">
    <span class="counter-display" id="counterDisplay">0</span>
    <span class="counter-label">اضغط للتسبيح</span>
  </button>
</div>

<!-- الشريط السفلي -->
<div class="bottom-bar">
  <button class="btn reset" id="resetBtn" aria-label="إعادة ضبط العداد الحالي">
    <span>↺</span> إعادة ضبط العداد الحالي
  </button>
</div>


<div class="creator-credit">
  <div>تصميم <strong>عواد دحبور</strong></div>
  <a href="https://wa.me/962788107669" target="_blank" rel="noopener" aria-label="التواصل عبر واتساب">
    للتواصل +٩٦٢٧٨٨١٠٧٦٦٩
  </a>
</div>

<!-- نافذة اختيار الذكر -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>اختر الذكر</h2>
      <button class="modal-close" id="modalClose" aria-label="إغلاق">✕</button>
    </div>
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<!-- نافذة تأكيد إعادة الضبط -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="icon">⚠️</div>
    <h3>تأكيد إعادة الضبط</h3>
    <p id="confirmMessage">هل أنت متأكد من إعادة ضبط عداد هذا الذكر؟</p>
    <div class="confirm-actions">
      <button class="btn cancel" id="confirmCancel">إلغاء</button>
      <button class="btn danger" id="confirmOk">نعم، أعد الضبط</button>
    </div>
  </div>
</div>

<!-- إشعار -->
<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  /* ============================================================
     1) تثبيت الـ Manifest (PWA) ديناميكياً — مثل teacher.html
     ============================================================ */
  var iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'
    + '<rect width="512" height="512" rx="96" fill="#1a1e2b"/>'
    + '<g fill="none" stroke="#ffd966" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">'
    + '<circle cx="256" cy="256" r="140"/>'
    + '<circle cx="256" cy="256" r="60"/>'
    + '<path d="M256 56v60M256 396v60M56 256h60M396 256h60"/>'
    + '</g></svg>';
  var iconDataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(iconSvg)));

  var baseHref = location.href.split('#')[0].split('?')[0];
  var baseDir  = baseHref.substring(0, baseHref.lastIndexOf('/') + 1);

  var manifest = {
    name: 'مسبحة إلكترونية',
    short_name: 'مسبحة',
    description: 'مسبحة إلكترونية بعدادات منفصلة لكل ذكر',
    lang: 'ar',
    dir: 'rtl',
    start_url: baseHref || './',
    scope: baseDir || './',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#0b0e14',
    theme_color: '#1a1e2b',
    categories: ['lifestyle', 'utilities'],
    icons: [
      { src: iconDataUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
      { src: iconDataUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
    ]
  };

  try {
    var manifestUrl = 'data:application/manifest+json;charset=utf-8,'
                    + encodeURIComponent(JSON.stringify(manifest));
    var linkManifest = document.createElement('link');
    linkManifest.rel = 'manifest';
    linkManifest.href = manifestUrl;
    document.head.appendChild(linkManifest);

    var metaTheme = document.createElement('meta');
    metaTheme.name = 'theme-color';
    metaTheme.content = '#1a1e2b';
    document.head.appendChild(metaTheme);

    var linkAppleIcon = document.createElement('link');
    linkAppleIcon.rel = 'apple-touch-icon';
    linkAppleIcon.href = iconDataUrl;
    document.head.appendChild(linkAppleIcon);

    var metaAppleTitle = document.createElement('meta');
    metaAppleTitle.name = 'apple-mobile-web-app-title';
    metaAppleTitle.content = 'مسبحة';
    document.head.appendChild(metaAppleTitle);
  } catch (e) { /* تجاهل */ }


  /* ============================================================
     2) منع السحب للرجوع (Swipe Back) — من teacher.html
     ============================================================ */
  document.documentElement.style.overscrollBehaviorX = 'none';
  document.body.style.overscrollBehaviorX = 'none';

  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartedAtEdge = false;

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    const edgeThreshold = 30;
    touchStartedAtEdge = (touchStartX < edgeThreshold) ||
                         (touchStartX > window.innerWidth - edgeThreshold);
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    if (touchStartedAtEdge) {
      const dx = Math.abs(e.touches[0].clientX - touchStartX);
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if (dx > dy && dx > 10) {
        const scrollable = e.target.closest('.modal-list, .current-dhikr, [data-scroll-x]');
        if (!scrollable) {
          e.preventDefault();
        }
      }
    }
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const target = e.target;
    if (target.closest('[data-scroll-x]')) return;
    const dx = Math.abs(e.touches[0].clientX - touchStartX);
    const dy = Math.abs(e.touches[0].clientY - touchStartY);
    if (dx > dy && dx > 15) {
      const scrollable = target.closest('.modal-list, .current-dhikr');
      if (!scrollable) {
        e.preventDefault();
      }
    }
  }, { passive: false });

  (function preventIOSBackSwipe() {
    if (!/iPad|iPhone|iPod/.test(navigator.userAgent)) return;
    try {
      window.history.pushState({ noBack: true }, '', window.location.href);
      window.addEventListener('popstate', () => {
        window.history.pushState({ noBack: true }, '', window.location.href);
      });
    } catch (e) {}
  })();

  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());
  document.addEventListener('gestureend', (e) => e.preventDefault());


  /* ============================================================
     3) قائمة الأذكار والعدادات
     ============================================================ */
  const ADHKAR = [
    'سبحان الله وبحمده سبحان الله العظيم',
    'لا اله إلا الله وحده لا شريك له له الملك يحي ويميت وهو الحي الذي لا يموت بيده الخير وهو على كل شيء قدير',
    'اللهم صل وسلم وبارك على سيدنا محمد وعلى اله وصحبه اجمعين',
    'أستغفر الله العظيم الذي لا اله إلا هو الحي القيوم و اتوب اليه',
    'لا حول ولا قوة إلا بالله العلي العظيم',
    'سبحان الله والحمدلله ولا إله إلا الله والله أكبر',
    'الحمدلله رب العالمين',
    'لا اله إلا أنت سبحانك إني كنت من الظالمين',
    'يا ذا الجلال و الكرام',
    'حسبي الله ونعم الوكيل',
    'اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استطعت أعوذ بك من شر ما صنعت أبوء لك بنعمتك علي وابوء بذنبي فاغفر لي فإنه لا يغفر الذنوب الا انت',
    'حسبنا الله سيؤتينا الله من فضله إنا إلى الله راغبون',
    'لَا إِلَهَ إِلَّا اللهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ'
  ];

  const DEFAULT_KEY = '__default__';
  const ACTIVE_KEY = 'misbaha_active_v2';
  const COUNTS_KEY = 'misbaha_counts_v2';

  const tapArea = document.getElementById('tapArea');
  const tapCircle = document.getElementById('tapCircle');
  const counterDisplay = document.getElementById('counterDisplay');
  const currentDhikrEl = document.getElementById('currentDhikr');
  const resetBtn = document.getElementById('resetBtn');
  const installBtn = document.getElementById('installBtn');
  const selectBtn = document.getElementById('selectBtn');
  const selectLabel = document.getElementById('selectLabel');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalList = document.getElementById('modalList');
  const modalClose = document.getElementById('modalClose');
  const toastEl = document.getElementById('toast');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMessage = document.getElementById('confirmMessage');
  const confirmCancel = document.getElementById('confirmCancel');
  const confirmOk = document.getElementById('confirmOk');

  let counts = {};
  let activeKey = DEFAULT_KEY;
  let isPressing = false;
  let deferredPrompt = null;

  /* ---------- التخزين ---------- */
  function loadCounts() {
    try {
      const raw = localStorage.getItem(COUNTS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') counts = parsed;
      }
    } catch (e) { counts = {}; }
    Object.keys(counts).forEach(k => {
      const n = parseInt(counts[k], 10);
      counts[k] = (isNaN(n) || n < 0) ? 0 : n;
    });
  }
  function saveCounts() {
    try { localStorage.setItem(COUNTS_KEY, JSON.stringify(counts)); } catch (e) {}
  }
  function loadActive() {
    try {
      const saved = localStorage.getItem(ACTIVE_KEY);
      if (saved && (saved === DEFAULT_KEY || /^dhikr_\d+$/.test(saved))) {
        activeKey = saved;
      }
    } catch (e) {}
  }
  function saveActive() {
    try { localStorage.setItem(ACTIVE_KEY, activeKey); } catch (e) {}
  }
  function getCount(key) { return counts[key] || 0; }
  function setCount(key, value) {
    if (value < 0) value = 0;
    counts[key] = value;
    saveCounts();
  }
  function incrementCount(key) {
    const newVal = getCount(key) + 1;
    counts[key] = newVal;
    saveCounts();
    return newVal;
  }

  /* ---------- عرض الذكر ---------- */
  function getDhikrLabel(key) {
    if (key === DEFAULT_KEY) return 'ذكر مطلق';
    const idx = parseInt(key.replace('dhikr_', ''), 10);
    if (isNaN(idx) || idx < 0 || idx >= ADHKAR.length) return 'ذكر مطلق';
    return ADHKAR[idx];
  }

  function refreshCurrentView(animate = false) {
    counterDisplay.textContent = getCount(activeKey);
    currentDhikrEl.textContent = getDhikrLabel(activeKey);
    if (animate) {
      counterDisplay.classList.add('bump');
      setTimeout(() => counterDisplay.classList.remove('bump'), 120);
    }
    if (activeKey === DEFAULT_KEY) {
      selectLabel.textContent = 'اختر الذكر';
    } else {
      selectLabel.textContent = 'الذكر المختار';
    }
  }

  /* ---------- الإشعارات ---------- */
  let toastTimeout = null;
  function showToast(message, duration = 2000) {
    if (toastTimeout) clearTimeout(toastTimeout);
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimeout = setTimeout(() => {
      toastEl.classList.remove('show');
      toastTimeout = null;
    }, duration);
  }
  window.showToast = showToast;

  /* ---------- قائمة الاختيار ---------- */
  function buildModalList() {
    modalList.innerHTML = '';
    addDhikrItem(DEFAULT_KEY, 'ذكر مطلق (بدون اختيار)');
    ADHKAR.forEach((text, i) => {
      addDhikrItem('dhikr_' + i, text);
    });
  }

  function addDhikrItem(key, text) {
    const item = document.createElement('div');
    item.className = 'dhikr-item' + (key === activeKey ? ' selected' : '');
    item.dataset.key = key;

    const textEl = document.createElement('div');
    textEl.className = 'text';
    textEl.textContent = text;

    const countEl = document.createElement('div');
    countEl.className = 'item-count';
    countEl.textContent = getCount(key);

    item.appendChild(textEl);
    item.appendChild(countEl);

    item.addEventListener('click', () => selectDhikr(key));
    modalList.appendChild(item);
  }

  function selectDhikr(key) {
    activeKey = key;
    saveActive();
    refreshCurrentView(false);
    closeModal();
    buildModalList();
  }

  function openModal() {
    buildModalList();
    modalOverlay.classList.add('show');
  }
  function closeModal() {
    modalOverlay.classList.remove('show');
  }

  /* ---------- زيادة العداد ---------- */
  function incrementCounter() {
    const newVal = incrementCount(activeKey);
    counterDisplay.textContent = newVal;
    counterDisplay.classList.add('bump');
    setTimeout(() => counterDisplay.classList.remove('bump'), 120);
  }

  /* ---------- إعادة الضبط مع تأكيد ---------- */
  function askResetConfirm() {
    const label = activeKey === DEFAULT_KEY ? 'الذكر المطلق' : 'هذا الذكر';
    confirmMessage.textContent = 'هل أنت متأكد من إعادة ضبط عداد ' + label + '؟';
    confirmOverlay.classList.add('show');
  }
  function doReset() {
    setCount(activeKey, 0);
    counterDisplay.textContent = 0;
    confirmOverlay.classList.remove('show');
    showToast('تمت إعادة ضبط العداد', 1500);
    if (modalOverlay.classList.contains('show')) buildModalList();
  }

  /* ---------- أحداث اللمس/الفأرة ---------- */
  let lastTapTime = 0;
  const TAP_THROTTLE_MS = 50;

  function handleTapStart(e) {
    if (e.target.closest('.btn')) return;
    isPressing = true;
    tapArea.classList.add('pressed');
  }

  function handleTapEnd(e) {
    if (!isPressing) return;
    isPressing = false;
    tapArea.classList.remove('pressed');

    const rect = tapArea.getBoundingClientRect();
    let x, y;
    if (e.changedTouches && e.changedTouches.length) {
      x = e.changedTouches[0].clientX;
      y = e.changedTouches[0].clientY;
    } else {
      x = e.clientX;
      y = e.clientY;
    }

    let inside = true;
    if (x !== undefined && y !== undefined) {
      inside = (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom);
    }
    if (!inside) return;

    const now = Date.now();
    if (now - lastTapTime < TAP_THROTTLE_MS) return;
    lastTapTime = now;

    incrementCounter();
  }

  function handleTapCancel() {
    isPressing = false;
    tapArea.classList.remove('pressed');
  }

  tapCircle.addEventListener('mousedown', handleTapStart);
  tapCircle.addEventListener('mouseup', handleTapEnd);
  tapCircle.addEventListener('mouseleave', handleTapCancel);

  tapCircle.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    handleTapStart(e);
  }, { passive: true });

  tapCircle.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleTapEnd(e);
  }, { passive: false });

  tapCircle.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    handleTapCancel();
  }, { passive: false });

  tapCircle.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'Space') {
      e.preventDefault();
      if (!isPressing) {
        isPressing = true;
        tapArea.classList.add('pressed');
      }
    }
  });

  tapCircle.addEventListener('keyup', (e) => {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'Space') {
      e.preventDefault();
      if (isPressing) {
        isPressing = false;
        tapArea.classList.remove('pressed');
        const now = Date.now();
        if (now - lastTapTime >= TAP_THROTTLE_MS) {
          lastTapTime = now;
          incrementCounter();
        }
      }
    }
  });

  tapCircle.addEventListener('blur', handleTapCancel);
  tapCircle.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });

  /* ---------- أزرار التحكم ---------- */
  resetBtn.addEventListener('click', (e) => { e.stopPropagation(); askResetConfirm(); });
  selectBtn.addEventListener('click', (e) => { e.stopPropagation(); openModal(); });
  modalClose.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

  confirmCancel.addEventListener('click', (e) => { e.stopPropagation(); confirmOverlay.classList.remove('show'); });
  confirmOk.addEventListener('click', (e) => { e.stopPropagation(); doReset(); });
  confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) confirmOverlay.classList.remove('show'); });

  [resetBtn, selectBtn, installBtn, modalClose, confirmCancel, confirmOk].forEach(btn => {
    btn.addEventListener('mousedown', (e) => e.stopPropagation());
    btn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    btn.addEventListener('mouseup', (e) => e.stopPropagation());
    btn.addEventListener('touchend', (e) => e.stopPropagation());
  });

  /* ---------- الحفظ عند الخروج ---------- */
  function saveAll() { saveCounts(); saveActive(); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
  window.addEventListener('pagehide', saveAll);
  window.addEventListener('beforeunload', saveAll);
  window.addEventListener('blur', saveAll);
  setInterval(saveAll, 15000);


  /* ============================================================
     4) زر التثبيت — نفس آلية teacher.html
     ============================================================ */
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true;

  function hideInstallBtn() {
    if (installBtn) installBtn.classList.add('hidden');
  }

  if (isStandalone) hideInstallBtn();

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.classList.remove('hidden');
  });

  window.addEventListener('appinstalled', () => {
    hideInstallBtn();
    deferredPrompt = null;
    showToast('✅ تم تثبيت التطبيق بنجاح على جهازك', 4000);
  });

  if (installBtn) {
    installBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function (choice) {
          if (choice && choice.outcome === 'accepted') {
            hideInstallBtn();
          }
          deferredPrompt = null;
        });
      } else {
        showToast(
          'لتثبيت التطبيق:\n' +
          '• Chrome / Edge على الحاسوب: ⋮ ← «تثبيت التطبيق»\n' +
          '• Android: ⋮ ← «إضافة إلى الشاشة الرئيسية»\n' +
          '• iPhone Safari: زر المشاركة ⬆ ← «إضافة إلى الشاشة الرئيسية»\n' +
          'ملاحظة: يجب فتح الصفحة عبر رابط https وليس ملفاً محلياً.',
          9000
        );
      }
    });
  }

  /* ---------- التهيئة ---------- */
  loadCounts();
  loadActive();
  if (!(DEFAULT_KEY in counts)) { counts[DEFAULT_KEY] = 0; saveCounts(); }
  if (!(activeKey in counts)) { counts[activeKey] = 0; saveCounts(); }
  refreshCurrentView(false);
  buildModalList();

  console.log('المسبحة جاهزة. الذكر النشط:', activeKey, 'العداد:', getCount(activeKey));

})();
</script>
</body>
</html>
